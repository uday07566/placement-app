<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="settings.css">
</head>
<body>

<div class="container">

    <h1>Profile Settings</h1>

    <form id="profileForm">

        <h3>Basic Information</h3>

        <input type="text" id="name" placeholder="Name" required>

        <input type="email" id="email" readonly>

        <input type="text" id="domain" placeholder="Domain">

        <input type="text" id="branch" placeholder="Branch">

        <h3>Professional Details</h3>

        <input type="text" id="type" placeholder="Placement / Internship">

        <input type="text" id="company" placeholder="Company">

        <input type="text" id="role" placeholder="Role">

        <input type="text" id="skills" placeholder="Skills">

        <textarea id="experience" placeholder="Experience"></textarea>

        <textarea id="resources" placeholder="Resources"></textarea>

        <input type="url" id="linkedin" placeholder="LinkedIn">

        <input type="url" id="github" placeholder="GitHub">

        <input type="text" id="major_skill" placeholder="Major Skill">

        <button type="submit">
            Update Profile
        </button>

    </form>

</div>

<script src="settings.js"></script>
<script src="theme.js"></script>

</body>
</html>
