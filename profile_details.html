<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Complete Profile</title>

    <link rel="stylesheet" href="profile_details.css">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>Complete Your Profile</h1>

        <p>
            Help juniors learn from your journey.
        </p>

        <div class="input-box">

            <label>Skills</label>

            <input
                type="text"
                id="skills"
                placeholder="React, Java, DSA, SQL..."
            >

        </div>

        <div class="input-box">

            <label>Experience</label>

            <textarea
                id="experience"
                placeholder="Share your placement journey..."
            ></textarea>

        </div>

        <div class="input-box">

            <label>Resources</label>

            <textarea
                id="resources"
                placeholder="Books, YouTube channels, Websites..."
            ></textarea>

        </div>

        <div class="input-box">

            <label>LinkedIn</label>

            <input
                type="url"
                id="linkedin"
                placeholder="https://linkedin.com/in/..."
            >

        </div>

        <div class="input-box">

            <label>GitHub</label>

            <input
                type="url"
                id="github"
                placeholder="https://github.com/..."
            >

        </div>

        <button id="saveBtn">

            Save & Continue

        </button>

    </div>

</div>

<script src="profile_details.js"></script>

</body>

</html>
