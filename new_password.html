<!DOCTYPE html>
<html >
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set new password</title>
  <link rel="stylesheet" href="./verify_otp.css" />
</head>
<body>
  <div class="reset-box">
    <div class="icon">🔑</div>
     <h2>Set New Password</h2>
     <div id="errorBox"></div>
     <form id="resetForm">
    <input type="hidden" id="email" />
    <input type="password" id="newPassword" placeholder="Enter new password" required />
    <input type="password" id="confirmPassword" placeholder="Re-enter new password" required />
   <button type="submit">Update Password</button>  
   </form>
   <p id="message"></p>
   <br>
    <a id="backLink">Back to Login</a> 
  </div>



<script>
// Get email from URL
const params = new URLSearchParams(window.location.search);
const email = params.get("email");

// 🔥 ALWAYS get type from localStorage FIRST
let type = localStorage.getItem("type");

// Optional: fallback to URL (if you still pass it)
if (!type) {
  type = params.get("type");
}

// Debug
console.log("TYPE (RESET PAGE):", type);

// ❌ If still missing → stop immediately
if (!type) {
  document.getElementById("errorBox").textContent =
    "User type missing. Please restart from login.";
}

// Save again (safety)
localStorage.setItem("type", type);

// Set email
document.getElementById("email").value = email;

// Set correct back link
const backLink = document.getElementById("backLink");

if (type === "senior") {
  backLink.href = "senior_login.html";
} else if (type === "junior") {
  backLink.href = "junior_login.html";
} else {
  backLink.href = "index.html";
}

const form = document.getElementById("resetForm");
const errorBox = document.getElementById("errorBox");
const message = document.getElementById("message");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  errorBox.textContent = "";
  message.textContent = "";

  const newPassword = document.getElementById("newPassword").value.trim();
  const confirmPassword = document.getElementById("confirmPassword").value.trim();

  if (!newPassword || !confirmPassword) {
    errorBox.textContent = "All fields are required";
    return;
  }

  if (newPassword !== confirmPassword) {
    errorBox.textContent = "Passwords do not match";
    return;
  }

  if (newPassword.length < 6) {
    errorBox.textContent = "Password must be at least 6 characters";
    return;
  }

  try {
    const res = await fetch("http://localhost:5000/reset-password", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        email,
        newPassword
      })
    });

    const data = await res.json();

    message.style.color = res.ok ? "green" : "red";
    message.textContent = data.message;

    if (res.ok) {
      setTimeout(() => {

        // 🔥 FINAL SAFE REDIRECT
        if (type === "senior") {
          window.location.href = "senior_login.html";
        } else if (type === "junior") {
          window.location.href = "junior_login.html";
        } else {
          errorBox.textContent = "User type missing. Restart process.";
        }

      }, 2000);
    }

  } catch (err) {
    message.style.color = "red";
    message.textContent = "Server error";
    console.error(err);
  }
});
</script>

</body>
</html>
