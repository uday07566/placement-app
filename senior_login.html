<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Senior Login</title>
  <link rel="stylesheet" href="./senior_login.css" />
</head>

<body>

<div class="login-box">

  <div class="icon">👨‍💼</div>

  <h2>Senior Placement Portal</h2>
  <p>Login to Share Your Experience</p>

  <!-- Message box -->
  <p id="loginMessage"></p>

  <!-- Form -->
  <form id="loginForm">

    <input type="text" id="loginEmail" placeholder="Enter your Email">

    <input type="password" id="loginPassword" placeholder="Enter your password">

    <button type="submit">Login</button>

  </form>

  <br><br>

  <a href="verify_otp.html">Forgot Password?</a>

  <br><br>

  <a href="senior_register.html">New senior? Register here</a>

</div>

<!-- JS -->
<script src="./senior_login.js"></script>

</body>
</html>
